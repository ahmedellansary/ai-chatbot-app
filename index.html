<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#131314">
  <meta name="description" content="نيترون — مساعد الذكاء الاصطناعي">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="نيترون">

  <title>نيترون</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
</head>
<body>
<div id="app">

  <!-- ═══ Sidebar Drawer ═══ -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="brand-logo">
        <div class="brand-icon">✦</div>
        <span>نيترون</span>
      </div>
      <button class="header-btn" id="close-sidebar-btn" aria-label="إغلاق">✕</button>
    </div>

    <div style="padding: 0 12px; display: flex; flex-direction: column; gap: 8px;">
      <button class="sidebar-action-btn" id="btn-new-chat">
        <span>＋</span>
        <span>محادثة جديدة</span>
      </button>
      <button class="sidebar-action-btn dev-btn" id="btn-dev-chat">
        <span>🛠️</span>
        <span>شات المطور (تعديل التطبيق)</span>
      </button>
    </div>

    <div class="sidebar-section-title">المحادثات الأخيرة</div>
    <div id="conversations-list"></div>

    <div class="sidebar-footer">
      <button class="footer-btn" id="install-btn" style="display:none;">
        <span>📲</span>
        <span>تثبيت التطبيق</span>
      </button>
      <button class="footer-btn" onclick="localStorage.clear(); location.reload()">
        <span>🗑️</span>
        <span>مسح السجل</span>
      </button>
    </div>
  </aside>

  <!-- ═══ Main View ═══ -->
  <main id="main">

    <!-- Top Header -->
    <header id="header">
      <button class="header-btn" id="sidebar-toggle" aria-label="القائمة">☰</button>

      <!-- Clean Model Selector Pill -->
      <button class="model-pill-btn" id="model-pill-trigger">
        <span class="model-dot-indicator"></span>
        <span id="header-model-label">نيترون · MID</span>
        <span style="font-size: 10px; opacity: 0.6;">▾</span>
      </button>

      <!-- Model Dropdown -->
      <div class="mode-dropdown" id="mode-dropdown-menu">
        <button class="dropdown-item" data-mode="HIGH">
          <span>⚡ HIGH (أقوى الموديلز)</span>
        </button>
        <button class="dropdown-item active" data-mode="MID">
          <span>⚖️ MID (متوازن وسريع)</span>
        </button>
        <button class="dropdown-item" data-mode="FAST">
          <span>🚀 FAST (الأسرع استجابة)</span>
        </button>
      </div>

      <button class="header-btn" id="header-new-chat-btn" title="محادثة جديدة">＋</button>
    </header>

    <!-- Chat Message Feed -->
    <div id="chat-area">
      <div class="chat-container" id="chat-container"></div>
    </div>

    <!-- Floating Input Bar -->
    <div id="input-section">
      <div class="input-container">
        <textarea
          id="user-input"
          class="chat-textarea"
          placeholder="كيف يمكنني مساعدتك اليوم؟"
          rows="1"
          autocomplete="off"
        ></textarea>
        <div class="input-bottom-bar">
          <div class="input-actions-left"></div>
          <button id="send-btn" class="send-button" disabled aria-label="إرسال">↑</button>
        </div>
      </div>
    </div>

  </main>

  <!-- Overlay -->
  <div id="overlay"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

</div>

<script src="./keys.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
