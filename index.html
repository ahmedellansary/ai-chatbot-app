<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#131315">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131315">
  <meta name="description" content="X.v1 — Advanced Intelligent Assistant">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="X.v1">

  <title>X.v1</title>
  <link rel="manifest" href="./manifest.json?v=333">
  <link rel="stylesheet" href="./style.css?v=333">
  <link rel="icon" type="image/png" href="./icons/icon-192.png?v=295">
  <link rel="apple-touch-icon" href="./icons/icon-192.png?v=295">
  <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png?v=295">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('xv1_theme') || 'obsidian';
        var f = localStorage.getItem('xv1_font_family') || 'inter';
        var s = localStorage.getItem('xv1_font_size') || 'md';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-font', f);
        document.documentElement.setAttribute('data-size', s);
      } catch(e) {}

      // Safe background cache cleanup without disruptive reload loops
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          // Service worker updated in background
        });
      }
      fetch('./version.json?t=' + Date.now()).then(function(r){ return r.json(); }).then(function(d){
        if (d && d.version) {
          var localVer = localStorage.getItem('XV1_APP_VERSION');
          if (localVer !== d.version) {
            localStorage.setItem('XV1_APP_VERSION', d.version);
            if (typeof caches !== 'undefined' && caches.keys) {
              caches.keys().then(function(keys){
                return Promise.all(keys.map(function(k){ return caches.delete(k); }));
              });
            }
          }
        }
      }).catch(function(){});
    })();
  </script>
  <script>
    (function () {
      var key = 'xv1_runtime_debug_log';
      function writeDebug(error, context) {
        var message = error && error.message ? error.message : String(error || 'Unknown error');
        var entry = {
          at: new Date().toISOString(),
          context: context || 'Runtime error',
          message: message,
          stack: error && error.stack ? error.stack : ''
        };
        try {
          var entries = JSON.parse(localStorage.getItem(key) || '[]');
          if (!Array.isArray(entries)) entries = [];
          entries.push(entry);
          localStorage.setItem(key, JSON.stringify(entries.slice(-30)));
        } catch (storageError) {
          console.error('[X.v1 debug log failed]', storageError);
        }
        console.error('[X.v1]', entry.context, entry.message, entry.stack);
        return entry;
      }
      window.printDebug = writeDebug;
      window.getDebugLog = function () {
        try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; }
      };
      window.addEventListener('error', function (event) {
        writeDebug(event.error || event.message, 'Early JavaScript error');
      });
      window.addEventListener('unhandledrejection', function (event) {
        writeDebug(event.reason, 'Early unhandled promise');
      });
    })();
  </script>
</head>
<body>
<div id="app">

  <!-- ═══ Drawer Sidebar (Left Side) ═══ -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="brand-logo">
        <span class="brand-star-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></span>
        <span>X.v1</span>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <button class="icon-btn" onclick="window._refreshApp()" title="تحديث ومزامنة التطبيق" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
        </button>
        <button class="icon-btn" id="close-sidebar-btn" aria-label="Close">✕</button>
      </div>
    </div>

    <!-- Main Navigation Actions -->
    <div class="sidebar-nav">
      <button class="nav-btn primary" id="btn-new-chat">
        <span>＋</span>
        <span>New Chat</span>
      </button>
    </div>

    <div class="sidebar-section-title">Recent Chats</div>
    <div id="conversations-list"></div>

    <div class="sidebar-footer">
      <button class="footer-btn" onclick="window._openSettingsModal()">
        <span>⚙️</span>
        <span>Settings</span>
      </button>
      <div id="app-version-badge" style="font-size:10.5px; color:var(--text-dim); font-family:var(--font-mono); text-align:center; padding:8px 0 2px; border-top:1px solid var(--border-subtle); margin-top:8px; letter-spacing:0.02em;">
        <span id="app-version-text">v333</span> • <span id="app-last-update">جاري...</span>
      </div>
    </div>
  </aside>

  <!-- ═══ Main View ═══ -->
  <main id="main">

    <!-- Top Header -->
    <header id="header" style="position:relative;">
      <button class="icon-btn" id="sidebar-toggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      </button>
      <div id="chat-top-badge" class="repo-status-badge" style="position:absolute; left:50%; transform:translateX(-50%);">
        <span class="status-dot"></span>
        <span class="repo-badge-text" id="chat-status-text" style="font-weight:700; letter-spacing:0.02em;">X (V333) —</span>
      </div>
      <script>
        (function() {
          var b = document.getElementById('chat-status-text');
          var saved = localStorage.getItem('CHAT_LAST_SYNC_BADGE');
          if (saved && b) b.textContent = saved;
          fetch('./version.json?t=' + Date.now()).then(function(r) { return r.json(); }).then(function(d) {
            if (d && d.version && d.updated_at && b) {
              var txt = 'X (V' + d.version + ') ' + d.updated_at;
              b.textContent = txt;
              localStorage.setItem('CHAT_LAST_SYNC_BADGE', txt);
            }
          }).catch(function(){});
        })();
      </script>
      <div class="header-right" style="display:flex; align-items:center; gap:8px;">
        <div id="usage-pie-wrap" class="usage-pie-wrap" title="الاستهلاك">
          <svg class="usage-pie" width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
            <circle class="pie-bg" cx="16" cy="16" r="14"></circle>
            <circle class="pie-fg" cx="16" cy="16" r="14" stroke-dasharray="0 88" stroke-dashoffset="0"></circle>
          </svg>
          <div id="usage-popup" class="usage-popup hidden">
            <div id="usage-popup-content" style="font-size:12px; line-height:1.6;"></div>
          </div>
        </div>
        <button class="icon-btn" onclick="window._refreshApp()" title="تحديث ومزامنة الصفحة" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
        </button>
      </div>
    </header>

    <!-- Modern Circular Pull to Refresh Indicator (سهم مدور مودرن بدون نصوص) -->
    <div id="pull-refresh-indicator" class="pull-refresh-indicator" aria-hidden="true">
      <svg class="pull-refresh-spinner" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
        <polyline points="21 3 21 9 15 9"></polyline>
      </svg>
    </div>

      <button class="chat-dot" data-mode="voice" aria-label="صوت"></button>
      <button class="chat-dot" data-mode="seekai" aria-label="SeekAI"></button>
    </div>

    <div id="input-section">

        <!-- Textarea -->

          class="chat-textarea"
          placeholder="Reply to X.v1..."

          autocomplete="off"

              <div class="skills-vertical-menu" id="skills-vertical-menu">

                  </div>
                </button>
                <button class="skills-menu-opt" onclick="window._triggerSkill('mindmap')">
                  <span class="skill-opt-icon">🗺️</span>

                    <div class="skill-opt-desc">Interactive visual tree outline</div>

                </button>
                <button class="skills-menu-opt" onclick="window._triggerSkill('slides')">

                    <div class="skill-opt-title">Slide Deck</div>
                    <div class="skill-opt-desc">1-click presentation slides</div>
                  </div>
                </button>
                <button class="skills-menu-opt" onclick="window._triggerSkill('sandbox')">

                  <div class="skill-opt-text">
                    <div class="skill-opt-title">Live Sandbox</div>
                    <div class="skill-opt-desc">Interactive app & code tester</div>

            <!-- Multi-Agent Toggle — icon only -->

            <!-- Model Selector Pill -->

              </button>

              <div class="model-dropdown" id="model-dropdown-menu">

                </button>
                <button class="dropdown-opt" data-mode="FAST">
                  <div class="opt-title">FAST</div>
                </button>
                <button class="dropdown-opt" id="other-models-trigger" data-mode="OTHER">

                <button class="dropdown-opt" data-seekai-model="claude-opus-5"><div class="opt-title">Claude Opus 5</div></button>
                <button class="dropdown-opt" data-seekai-model="claude-sonnet-5"><div class="opt-title">Claude Sonnet 5</div></button>
                <button class="dropdown-opt" data-seekai-model="claude-opus-4-8"><div class="opt-title">Claude Opus 4.8</div></button>
                <button class="dropdown-opt" data-seekai-model="claude-fable-5"><div class="opt-title">Claude Fable 5</div></button>
                <button class="dropdown-opt" data-seekai-model="gpt-5-6"><div class="opt-title">GPT-5</div></button>
                <button class="dropdown-opt" data-seekai-model="grok-4-6"><div class="opt-title">Grok 4</div></button>
                <button class="dropdown-opt" data-seekai-model="deepseek-v4-pro"><div class="opt-title">DeepSeek Pro</div></button>
                <button class="dropdown-opt" data-seekai-model="deepseek-v4-flash-0731"><div class="opt-title">DeepSeek Flash</div></button>
                <button class="dropdown-opt" data-seekai-model="kimi-k3"><div class="opt-title">Kimi K3</div></button>
              </div>
            </div>
          </div>

          <!-- Right Controls (Mic & Send) -->

                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>

        </div>

        <!-- Hidden Native File Input -->
        <input type="file" id="file-upload-input" multiple accept="image/*,text/*,.pdf,.txt,.js,.py,.html,.css,.json,.md,.csv" style="display: none;">
      </div>
    </div>

    <!-- Voice Chat Box — hidden until dot 2 touch -->
    <div id="voice-input-section" class="hidden">
      <div class="input-container voice-container">
        <!-- Voice Controls Top — Model + dynamic voices + accent + speed -->
        <div class="voice-controls-top">
          <label class="voice-ctrl-label">🎙️</label>
          <select id="tts-model-select" class="tts-voice-select" title="اختيار الموديل">

            <option value="openai/tts-1-hd">GPT HD</option>
            <option value="openai/tts-1">GPT</option>
          </select>

            <option value="ar-EG">مصري</option>
            <option value="ar-SA">خليجي</option>
            <option value="ar-LB">لبناني</option>

          </select>

        <div class="input-bottom-bar">
          <div class="input-bottom-left">
            <button class="claude-plus-btn" id="voice-attach-btn" title="إرفاق نص" aria-label="Attach">

            </button>
            <button class="claude-voice-btn" id="voice-mic-btn" title="تسجيل صوتي">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
            </button>

    <!-- SeekAI Box — نسخة طبق الأصل من العام (إطار خفيف + أيقونز تحت) -->

      <div class="input-container seekai-container">
        <textarea id="seekai-input" class="chat-textarea" placeholder="اكتب طلبك لـ SeekAI (شات / صورة / فيديو / صوت)..." rows="1" autocomplete="off"></textarea>

          <div class="input-bottom-left">

            </button>

                <option value="image">Image</option>
                <option value="video">Video</option>
                <option value="audio">Audio</option>
              </select>
            </div>
            <div style="position:relative;">
              <select id="seekai-model-select" class="claude-model-pill" title="الموديل" style="padding:6px 22px 6px 10px; font-size:12px; background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.10); color: var(--text-main); max-width:130px;"><option>جاري...</option></select>
            </div>
            <button class="claude-plus-btn" id="seekai-refresh-btn" title="تحديث" aria-label="Refresh">↻</button>
          </div>
          <div class="input-bottom-right">
            <button class="claude-voice-btn" id="seekai-mic-btn" title="تسجيل صوتي">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
            </button>
            <button id="seekai-send-btn" class="claude-send-btn" aria-label="Send SeekAI" title="إرسال" disabled>

            </button>

      </div>

  </main>

  <!-- ═══ Interactive Live Sandbox Modal ═══ -->
  <div id="sandbox-modal" class="custom-modal hidden">
    <div class="custom-modal-card sandbox-card">
      <div class="custom-modal-header">
        <div class="modal-header-title">
          <span>🧪</span>
          <span>Live Interactive Sandbox</span>
        </div>
        <div class="modal-header-actions">
          <button class="icon-btn" onclick="window._reloadSandbox()" title="Restart">🔄</button>
          <button class="icon-btn" onclick="window._closeSandbox()" title="Close">✕</button>
        </div>
      </div>
      <div class="sandbox-iframe-wrap">
        <iframe id="sandbox-frame" sandbox="allow-scripts allow-modals allow-same-origin" title="Sandbox Output"></iframe>
      </div>
    </div>
  </div>

  <!-- ═══ Interactive Slide Deck Presentation Modal ═══ -->
  <div id="slides-modal" class="custom-modal hidden">
    <div class="custom-modal-card slides-card">
      <div class="custom-modal-header">
        <div class="modal-header-title">
          <span>📊</span>
          <span id="slides-deck-title">Interactive Slide Deck</span>
        </div>
        <div class="modal-header-actions">
          <button class="modal-action-btn" onclick="window._exportSlidesHTML()">📥 Download HTML</button>
          <button class="icon-btn" onclick="window._closeSlides()" title="Close">✕</button>
        </div>
      </div>
      <div class="slides-viewer-body">
        <div class="slide-content-area" id="slide-content-area"></div>
      </div>
      <div class="slides-footer-controls">
        <button class="slide-nav-btn" onclick="window._prevSlide()">◀ Previous</button>
        <span id="slide-indicator" class="slide-indicator">1 / 1</span>
        <button class="slide-nav-btn" onclick="window._nextSlide()">Next ▶</button>
      </div>
    </div>
  </div>

  <!-- ═══ Settings Modal ═══ -->
  <div id="settings-modal" class="custom-modal hidden" aria-hidden="true">
    <div class="custom-modal-card settings-card" style="max-width: 680px;">
      <div class="custom-modal-header">
        <div class="modal-header-title">
          <span>⚙️</span>
          <span>Settings</span>
        </div>
        <div class="modal-header-actions">
          <button class="icon-btn" onclick="window._closeSettingsModal()" title="Close">✕</button>
        </div>
      </div>

      <div class="settings-modal-body">
        
        <!-- ═══ Settings Navigation Tabs (vertical) ═══ -->
        <div class="settings-modal-tabs-bar">
          <button type="button" class="settings-tab-btn active" data-tab="models" onclick="window._switchSettingsTab('models')">
            <span>🤖</span>
            <span>Models</span>
          </button>
          <button type="button" class="settings-tab-btn" data-tab="themes" onclick="window._switchSettingsTab('themes')">
            <span>🎨</span>
            <span>Theme</span>
          </button>
          <button type="button" class="settings-tab-btn" data-tab="instructions" onclick="window._switchSettingsTab('instructions')">
            <span>📁</span>
            <span>Instructions</span>
          </button>
          <button type="button" class="settings-tab-btn" data-tab="system" onclick="window._switchSettingsTab('system')">
            <span>⚙️</span>
            <span>System</span>
          </button>
          <button type="button" class="settings-tab-btn settings-tab-clear-btn" onclick="window._clearAppCache()" title="Clear Cache & Reload">
            <span>🧹</span>
            <span>Clear Cache</span>
          </button>
        </div>

        <!-- ═══ Tab: Models — Sorted strongest→weakest, per-model usage === -->
        <div id="settings-tab-models" class="settings-tab-pane active">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <div style="font-size:13px; font-weight:800;">📊 Models</div>
          </div>
          <div style="overflow:auto; max-height:320px; border:1px solid var(--border-subtle); border-radius:10px;">
            <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
              <thead><tr style="background:rgba(0,0,0,0.2);"><th style="padding:8px; text-align:left; width:32px;">✓</th><th style="padding:8px; text-align:left;">Model</th><th style="padding:8px; text-align:left;">Usage</th></tr></thead>
              <tbody id="models-tbody-inline"></tbody>
            </table>
          </div>
        </div>

        <!-- ═══ Tab 1: Themes & Fonts ═══ -->
        <div id="settings-tab-themes" class="settings-tab-pane hidden">
          <div style="display:flex; flex-direction:column; gap:14px;">
            <!-- Theme Selection — simple circles -->
            <div>
              <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px;">Theme</label>
              <div style="display:flex; gap:12px; align-items:center;">
                <button type="button" title="Obsidian" data-theme="obsidian" onclick="window._setAppTheme('obsidian')" style="width:28px; height:28px; border-radius:50%; background:#0a0a0f; border:2px solid var(--accent-color); cursor:pointer;"></button>
                <button type="button" title="Emerald" data-theme="emerald" onclick="window._setAppTheme('emerald')" style="width:28px; height:28px; border-radius:50%; background:#06402B; border:2px solid transparent; cursor:pointer;"></button>
                <button type="button" title="Amethyst" data-theme="amethyst" onclick="window._setAppTheme('amethyst')" style="width:28px; height:28px; border-radius:50%; background:#2a1040; border:2px solid transparent; cursor:pointer;"></button>
                <button type="button" title="Sapphire" data-theme="sapphire" onclick="window._setAppTheme('sapphire')" style="width:28px; height:28px; border-radius:50%; background:#0f1e3a; border:2px solid transparent; cursor:pointer;"></button>
              </div>
            </div>

            <!-- Font Family -->
            <div style="padding-top:10px; border-top:1px solid var(--border-subtle);">
              <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px;">Font Family</label>
              <div class="custom-pill-selector-row">
                <button type="button" class="custom-pill-btn active" data-font="inter" onclick="window._setAppFontFamily('inter')">Inter</button>
                <button type="button" class="custom-pill-btn" data-font="cairo" onclick="window._setAppFontFamily('cairo')">Cairo</button>
                <button type="button" class="custom-pill-btn" data-font="tajawal" onclick="window._setAppFontFamily('tajawal')">Tajawal</button>
                <button type="button" class="custom-pill-btn" data-font="mono" onclick="window._setAppFontFamily('mono')">Mono</button>
              </div>
            </div>

            <!-- Font Size -->
            <div>
              <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px;">Font Size</label>
              <div class="custom-pill-selector-row">
                <button type="button" class="custom-pill-btn" data-size="sm" onclick="window._setAppFontSize('sm')">Small</button>
                <button type="button" class="custom-pill-btn active" data-size="md" onclick="window._setAppFontSize('md')">Medium</button>
                <button type="button" class="custom-pill-btn" data-size="lg" onclick="window._setAppFontSize('lg')">Large</button>
                <button type="button" class="custom-pill-btn" data-size="xl" onclick="window._setAppFontSize('xl')">XL</button>
              </div>
            </div>
          </div>
        </div>

        <!-- ═══ Tab 3: Instruction Files Manager ═══ -->
        <div id="settings-tab-instructions" class="settings-tab-pane hidden">
          <div class="inst-manager-topbar">
            <div class="inst-topbar-actions" style="margin-bottom: 8px;">
              <button class="settings-action-btn" onclick="window._addNewInstructionFile()"><span>+</span> Add New File</button>
              <button class="settings-action-btn" onclick="window._resetDefaultInstructionFiles()">Reset Default</button>
            </div>
          </div>

          <!-- Instruction Files Grid / List -->
          <div id="instruction-files-list" class="instruction-files-list"></div>

          <!-- Active Instruction Editor Sub-panel — simplified -->
          <div id="instruction-editor-panel" class="instruction-editor-panel hidden">
            <div style="display:flex; align-items:center; gap:8px; padding:10px 12px; background:rgba(255,255,255,0.04); border:1px solid var(--border-subtle); border-radius:10px;">
              <span id="inst-editor-icon" style="font-size:16px;">📄</span>
              <span id="inst-editor-title" style="flex:1; font-weight:700; font-size:13px;"></span>
              <button onclick="navigator.clipboard.writeText(document.getElementById('inst-editor-title').textContent); if(window.MessageRenderer) window.MessageRenderer.showToast('Copied','success')" style="padding:4px 8px; font-size:11px; border:1px solid var(--border-subtle); border-radius:6px; background:transparent; cursor:pointer;" title="Copy">📋</button>
              <button onclick="window._closeInstructionEditor()" style="padding:4px 8px; font-size:11px; border:none; background:transparent; cursor:pointer;">✕</button>
            </div>
          </div>
        </div>

        <!-- ═══ Tab 4: System & Cache & Usage ═══ -->
        <div id="settings-tab-system" class="settings-tab-pane hidden">
          <!-- Developer Studio Portal Link -->
          <div class="settings-section" style="margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--border-subtle);">
            <a href="./dev.html" target="_blank" class="footer-btn" style="color: #fbbf24; text-decoration: none; border: 1px solid rgba(251, 191, 36, 0.3); border-radius: 8px; padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; font-size:12.5px;">
              <span>🛠️ Developer Studio (X.v1 Dev)</span>
              <span>↗</span>
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Overlay -->
  <div id="overlay"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- ═══ App Lock Gate ═══ -->
  <div id="app-lock-gate" class="app-lock-gate hidden" aria-live="polite">
    <div class="lock-gate-card">
      <div class="lock-gate-star">🔒</div>
      <h2 class="lock-gate-title">X.v1</h2>
      <p class="lock-gate-sub">أدخل كلمة السر للدخول</p>
      <form id="lock-gate-form" style="width:100%; display:flex; flex-direction:column; gap:10px;">
        <input type="password" id="gate-pin-input" class="lock-gate-input" placeholder="Enter password..." maxlength="32" autocomplete="current-password">
        <div class="lock-gate-actions-row">
          <button type="submit" id="gate-unlock-btn" class="lock-gate-btn"><span>Unlock Workspace</span> <span>🔓</span></button>
          <button type="button" id="gate-sync-btn" class="lock-gate-icon-btn" title="مسح وإعادة ضبط" onclick="window._secretSyncAndClearGate()" aria-label="Reset & Sync">
            <svg class="gate-sync-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
          </button>
        </div>
      </form>
    </div>
  </div>

</div>

<!-- Consolidated High-Performance Script Bundle -->
<script src="./config.js?v=333"></script>
<script src="./auth.js?v=333"></script>
<script src="./models.js?v=333"></script>
<script src="./github.js?v=333"></script>
<script src="./instruction-manager.js?v=333"></script>
<script src="./app.js?v=333"></script>
</body>
</html>
