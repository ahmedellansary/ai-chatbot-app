<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#131314">
  <meta name="description" content="X.v1 — المساعد الذكي المتقدم">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="X.v1">

  <title>X.v1</title>
  <link rel="manifest" href="./manifest.json?v=20260901">
  <link rel="stylesheet" href="./style.css?v=20260901">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✳️</text></svg>">
</head>
<body>
<div id="app">

  <!-- ═══ Drawer Sidebar (القائمة الجانبية) ═══ -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="brand-logo">
        <span class="claude-star-icon">✳️</span>
        <span>X.v1</span>
      </div>
      <button class="icon-btn" id="close-sidebar-btn" aria-label="إغلاق">✕</button>
    </div>

    <!-- Main Navigation Actions -->
    <div class="sidebar-nav">
      <button class="nav-btn primary" id="btn-new-chat">
        <span>＋</span>
        <span>محادثة جديدة</span>
      </button>
      <button class="nav-btn dev" id="btn-dev-chat">
        <span>🛠️</span>
        <span>وضع المطور (تعديل التطبيق)</span>
      </button>
    </div>

    <!-- Emergency Controls (أزرار الطوارئ داخل القائمة الجانبية فقط) -->
    <div class="emergency-box">
      <div class="emergency-title">🚨 تحكم الطوارئ (Safety Controls)</div>
      <button class="emergency-btn rollback" id="btn-emergency-rollback">
        <span>⏪</span>
        <span>استرجاع فوري لآخر نسخة</span>
      </button>
      <button class="emergency-btn fix" id="btn-emergency-fix">
        <span>🔍</span>
        <span>مراجعة وإصلاح آخر تعديل</span>
      </button>
    </div>

    <div class="sidebar-section-title">المحادثات السابقة</div>
    <div id="conversations-list"></div>

    <div class="sidebar-footer">
      <button class="footer-btn" id="btn-toggle-owner-lock">
        <span id="owner-lock-icon">🔒</span>
        <span id="owner-lock-text">تسجيل دخول المالك</span>
      </button>
      <button class="footer-btn" id="install-btn" style="display:none;">
        <span>📲</span>
        <span>تثبيت التطبيق على الموبايل</span>
      </button>
      <button class="footer-btn" onclick="localStorage.clear(); location.reload()">
        <span>🗑️</span>
        <span>مسح السجل والكاش</span>
      </button>
    </div>
  </aside>

  <!-- ═══ Main View (واجهة Claude الأصلية) ═══ -->
  <main id="main">

    <!-- Top Header (Claude Style) -->
    <header id="header">
      <button class="icon-btn" id="sidebar-toggle" aria-label="القائمة">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      </button>

      <div class="header-right-actions">
        <!-- New Chat Bubble Icon -->
        <button class="icon-btn" id="header-new-chat-btn" title="محادثة جديدة" aria-label="محادثة جديدة">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <line x1="12" y1="8" x2="12" y2="14"></line>
            <line x1="9" y1="11" x2="15" y2="11"></line>
          </svg>
        </button>

        <!-- Overflow Menu Dots -->
        <button class="icon-btn" id="header-dots-btn" title="خيارات" aria-label="خيارات">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <circle cx="12" cy="6" r="1.8"></circle>
            <circle cx="12" cy="12" r="1.8"></circle>
            <circle cx="12" cy="18" r="1.8"></circle>
          </svg>
        </button>
      </div>
    </header>

    <!-- Pull to Refresh Touch Indicator (اسحب للتحديث باللمس) -->
    <div id="pull-refresh-indicator" class="pull-refresh-indicator">
      <span class="pull-icon">↓</span>
      <span class="pull-text">اسحب للتحديث</span>
    </div>

    <!-- Chat Messages Feed -->
    <div id="chat-area">
      <div class="chat-container" id="chat-container"></div>
    </div>

    <!-- Floating Input Bar (Claude Mobile Pixel-Perfect Style) -->
    <div id="input-section">
      <div class="input-container">

        <!-- Attachment Previews -->
        <div id="attachment-preview-container" class="attachment-previews hidden"></div>

        <!-- Textarea -->
        <textarea
          id="user-input"
          class="chat-textarea"
          placeholder="Reply to X.v1..."
          rows="1"
          autocomplete="off"
        ></textarea>

        <!-- Bottom Controls Row inside Container -->
        <div class="input-bottom-bar">
          
          <!-- Left Controls (Plus & Model Pill) -->
          <div class="input-bottom-left">
            <!-- Plus Button -->
            <button class="claude-plus-btn" id="attach-btn" title="إرفاق ملفات أو صور" aria-label="إرفاق">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>

            <!-- Model Selector Pill (e.g. Sonnet 5 Thinking) -->
            <div style="position: relative;">
              <button class="claude-model-pill" id="model-pill-trigger">
                <span id="header-title-text">Sonnet 5 · Thinking</span>
              </button>

              <div class="model-dropdown" id="model-dropdown-menu">
                <button class="dropdown-opt" data-mode="HIGH">
                  <div class="opt-title">⚡ Sonnet 5 / Ultra (أقوى الموديلز)</div>
                  <div class="opt-desc">Nemotron Ultra 550B + MiniMax M3</div>
                </button>
                <button class="dropdown-opt active" data-mode="MID">
                  <div class="opt-title">⚖️ Sonnet 3.7 (متوازن وذكي)</div>
                  <div class="opt-desc">Nemotron 120B + GPT OSS 120B</div>
                </button>
                <button class="dropdown-opt" data-mode="FAST">
                  <div class="opt-title">🚀 Haiku 3.5 (الأسرع استجابة)</div>
                  <div class="opt-desc">Groq Compound + Qwen 3.6 27B</div>
                </button>
              </div>
            </div>
          </div>

          <!-- Right Controls (Mic, Waveform Voice & Send) -->
          <div class="input-bottom-right">
            <!-- Mic Button -->
            <button class="claude-voice-btn" id="mic-btn" title="تسجيل صوتي">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
              </svg>
            </button>

            <!-- Audio Waveform Button -->
            <button class="claude-waveform-pill" id="voice-mode-btn" title="وضع الصوت التفاعلي">
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
            </button>

            <!-- Send Button (Visible when typing) -->
            <button id="send-btn" class="claude-send-btn hidden" aria-label="إرسال">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>

        </div>

        <!-- Hidden Native File Input -->
        <input type="file" id="file-upload-input" multiple accept="image/*,text/*,.pdf,.txt,.js,.py,.html,.css,.json,.md,.csv" style="display: none;">
      </div>
    </div>

  </main>

  <div id="startup-check" class="startup-check hidden" aria-live="polite">
    <div class="startup-check-header">🔎 تحقق الواجهة</div>
    <div class="startup-check-status" id="startup-check-status">جاري فحص الواجهة...</div>
    <div class="startup-check-actions">
      <button class="startup-check-btn success" id="startup-check-ok">موافق</button>
      <button class="startup-check-btn danger" id="startup-check-fix">مراجعة وإصلاح</button>
    </div>
  </div>

  <!-- ═══ Owner Security Authentication Modal (قفل المالك السري) ═══ -->
  <div id="owner-auth-modal" class="owner-modal hidden" aria-live="polite">
    <div class="owner-modal-card">
      <div class="owner-modal-icon">🔐</div>
      <h3 class="owner-modal-title">التحقق من هوية المالك</h3>
      <p class="owner-modal-desc">وضع المطور والتعديل على GitHub محمي برمز سري خاص بالمالك فقط لمنع أي تعديل خارجي.</p>
      
      <div class="pin-input-wrap">
        <input type="password" id="owner-pin-input" class="owner-pin-input" placeholder="أدخل رمز الـ PIN السري" maxlength="12" autocomplete="off">
      </div>

      <div class="owner-modal-actions">
        <button id="owner-auth-submit" class="owner-modal-btn primary">تأكيد ودخول</button>
        <button id="owner-auth-cancel" class="owner-modal-btn cancel">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- Overlay -->
  <div id="overlay"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

</div>

<!-- Single Unified Application Bundle (No external imports that could fail) -->
<script src="./app.js?v=20260901"></script>
</body>
</html>
