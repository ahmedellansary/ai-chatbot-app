<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#131314">
  <meta name="description" content="X.v1 — المساعد الذكي المتقدم">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="X.v1">

  <title>X.v1</title>
  <link rel="manifest" href="./manifest.json?v=20260901">
  <link rel="stylesheet" href="./style.css?v=20260901">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
</head>
<body>
<div id="app">

  <!-- ═══ Drawer Sidebar (القائمة الجانبية) ═══ -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="brand-logo">
        <span class="brand-star-icon">✦</span>
        <span>X.v1</span>
      </div>
      <button class="icon-btn" id="close-sidebar-btn" aria-label="إغلاق">✕</button>
    </div>

    <!-- Main Navigation Actions -->
    <div class="sidebar-nav">
      <button class="nav-btn primary" id="btn-new-chat">
        <span>＋</span>
        <span>محادثة جديدة</span>
      </button>
      <button class="nav-btn dev" id="btn-dev-chat">
        <span>🛠️</span>
        <span>وضع المطور (تعديل التطبيق)</span>
      </button>
    </div>

    <!-- OpenMAIC Multi-Agent Skills Section -->
    <div class="sidebar-section-title">الأوضاع المتقدمة (OpenMAIC)</div>
    <div class="sidebar-skills-grid">
      <button class="skill-menu-btn" onclick="window._triggerSkill('roundtable')">
        <span class="skill-icon">👥</span>
        <div class="skill-info">
          <div class="skill-name">طاولة النقاش (Roundtable)</div>
          <div class="skill-sub">3 وكلاء يناقشون فكرتك</div>
        </div>
      </button>
      <button class="skill-menu-btn" onclick="window._triggerSkill('mindmap')">
        <span class="skill-icon">🗺️</span>
        <div class="skill-info">
          <div class="skill-name">الخرائط الذهنية (Mind Map)</div>
          <div class="skill-sub">رسم شجري مرئي تفاعلي</div>
        </div>
      </button>
      <button class="skill-menu-btn" onclick="window._triggerSkill('slides')">
        <span class="skill-icon">📊</span>
        <div class="skill-info">
          <div class="skill-name">صانع الشرائح (Slide Deck)</div>
          <div class="skill-sub">عرض تقديمي تفاعلي جاهز</div>
        </div>
      </button>
      <button class="skill-menu-btn" onclick="window._triggerSkill('sandbox')">
        <span class="skill-icon">🧪</span>
        <div class="skill-info">
          <div class="skill-name">مختبر المحاكاة (Sandbox)</div>
          <div class="skill-sub">تشغيل وتجربة الأكواد حياً</div>
        </div>
      </button>
    </div>

    <div class="sidebar-section-title">المحادثات السابقة</div>
    <div id="conversations-list"></div>

    <div class="sidebar-footer">
      <button class="footer-btn" id="install-btn" style="display:none;">
        <span>📲</span>
        <span>تثبيت التطبيق على الموبايل</span>
      </button>
      <button class="footer-btn" onclick="localStorage.clear(); location.reload()">
        <span>🗑️</span>
        <span>مسح السجل والكاش</span>
      </button>
    </div>
  </aside>

  <!-- ═══ Main View (الواجهة الرئيسية) ═══ -->
  <main id="main">

    <!-- Top Header -->
    <header id="header">
      <button class="icon-btn" id="sidebar-toggle" aria-label="القائمة">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      </button>

      <div class="header-right-actions">
        <!-- New Chat Bubble Icon -->
        <button class="icon-btn" id="header-new-chat-btn" title="محادثة جديدة" aria-label="محادثة جديدة">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <line x1="12" y1="8" x2="12" y2="14"></line>
            <line x1="9" y1="11" x2="15" y2="11"></line>
          </svg>
        </button>

        <!-- Overflow Menu Dots -->
        <button class="icon-btn" id="header-dots-btn" title="خيارات" aria-label="خيارات">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <circle cx="12" cy="6" r="1.8"></circle>
            <circle cx="12" cy="12" r="1.8"></circle>
            <circle cx="12" cy="18" r="1.8"></circle>
          </svg>
        </button>
      </div>
    </header>

    <!-- Pull to Refresh Touch Indicator (اسحب للتحديث باللمس) -->
    <div id="pull-refresh-indicator" class="pull-refresh-indicator">
      <span class="pull-icon">↓</span>
      <span class="pull-text">اسحب للتحديث</span>
    </div>

    <!-- Chat Messages Feed -->
    <div id="chat-area">
      <div class="chat-container" id="chat-container"></div>
    </div>

    <!-- Floating Input Bar & Quick Skills -->
    <div id="input-section">

      <!-- Skills Quick Selector Bar -->
      <div class="skills-bar" id="skills-bar">
        <button class="skill-chip" onclick="window._triggerSkill('roundtable')">
          <span>👥</span>
          <span>طاولة النقاش</span>
        </button>
        <button class="skill-chip" onclick="window._triggerSkill('mindmap')">
          <span>🗺️</span>
          <span>خريطة ذهنية</span>
        </button>
        <button class="skill-chip" onclick="window._triggerSkill('slides')">
          <span>📊</span>
          <span>صانع شرائح</span>
        </button>
        <button class="skill-chip" onclick="window._triggerSkill('sandbox')">
          <span>🧪</span>
          <span>محاكاة تفاعلية</span>
        </button>
      </div>

      <div class="input-container">

        <!-- Attachment Previews -->
        <div id="attachment-preview-container" class="attachment-previews hidden"></div>

        <!-- Textarea -->
        <textarea
          id="user-input"
          class="chat-textarea"
          placeholder="اكتب رسالتك أو اختر مهارة..."
          rows="1"
          autocomplete="off"
        ></textarea>

        <!-- Bottom Controls Row inside Container -->
        <div class="input-bottom-bar">
          
          <!-- Left Controls (Plus & Model Pill) -->
          <div class="input-bottom-left">
            <!-- Plus / Attach Button -->
            <button class="claude-plus-btn" id="attach-btn" title="إرفاق ملفات أو صور" aria-label="إرفاق">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>

            <!-- Model Selector Pill -->
            <div style="position: relative;">
              <button class="claude-model-pill" id="model-pill-trigger">
                <span id="header-title-text">MID</span>
                <svg viewBox="0 0 12 12" width="10" height="10" fill="currentColor"><path d="M2 4l4 4 4-4z"/></svg>
              </button>

              <div class="model-dropdown" id="model-dropdown-menu">
                <button class="dropdown-opt" data-mode="HIGH">
                  <div class="opt-title">HIGH</div>
                  <div class="opt-desc">Nemotron 550B · MiniMax M3</div>
                </button>
                <button class="dropdown-opt active" data-mode="MID">
                  <div class="opt-title">MID</div>
                  <div class="opt-desc">Nemotron 120B · GPT OSS 120B</div>
                </button>
                <button class="dropdown-opt" data-mode="FAST">
                  <div class="opt-title">FAST</div>
                  <div class="opt-desc">Groq Compound · Qwen 27B</div>
                </button>
              </div>
            </div>
          </div>

          <!-- Right Controls (Mic, Waveform Voice & Send) -->
          <div class="input-bottom-right">
            <!-- Mic Button -->
            <button class="claude-voice-btn" id="mic-btn" title="تسجيل صوتي">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
              </svg>
            </button>

            <!-- Audio Waveform Button -->
            <button class="claude-waveform-pill" id="voice-mode-btn" title="وضع الصوت التفاعلي">
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
            </button>

            <!-- Send Button (Visible when typing) -->
            <button id="send-btn" class="claude-send-btn hidden" aria-label="إرسال">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>

        </div>

        <!-- Hidden Native File Input -->
        <input type="file" id="file-upload-input" multiple accept="image/*,text/*,.pdf,.txt,.js,.py,.html,.css,.json,.md,.csv" style="display: none;">
      </div>
    </div>

  </main>

  <!-- ═══ Interactive Live Sandbox Modal (مشغل المحاكاة الحية) ═══ -->
  <div id="sandbox-modal" class="custom-modal hidden">
    <div class="custom-modal-card sandbox-card">
      <div class="custom-modal-header">
        <div class="modal-header-title">
          <span>🧪</span>
          <span>مختبر المحاكاة التفاعلية (Live Sandbox)</span>
        </div>
        <div class="modal-header-actions">
          <button class="icon-btn" onclick="window._reloadSandbox()" title="إعادة تشغيل">🔄</button>
          <button class="icon-btn" onclick="window._closeSandbox()" title="إغلاق">✕</button>
        </div>
      </div>
      <div class="sandbox-iframe-wrap">
        <iframe id="sandbox-frame" sandbox="allow-scripts allow-modals allow-same-origin" title="Sandbox Output"></iframe>
      </div>
    </div>
  </div>

  <!-- ═══ Interactive Slide Deck Presentation Modal (عارض الشرائح التفاعلي) ═══ -->
  <div id="slides-modal" class="custom-modal hidden">
    <div class="custom-modal-card slides-card">
      <div class="custom-modal-header">
        <div class="modal-header-title">
          <span>📊</span>
          <span id="slides-deck-title">العرض التقديمي التفاعلي</span>
        </div>
        <div class="modal-header-actions">
          <button class="modal-action-btn" onclick="window._exportSlidesHTML()">📥 تنزيل العرض</button>
          <button class="icon-btn" onclick="window._closeSlides()" title="إغلاق">✕</button>
        </div>
      </div>
      <div class="slides-viewer-body">
        <div class="slide-content-area" id="slide-content-area"></div>
      </div>
      <div class="slides-footer-controls">
        <button class="slide-nav-btn" onclick="window._prevSlide()">◀ السابق</button>
        <span id="slide-indicator" class="slide-indicator">1 / 1</span>
        <button class="slide-nav-btn" onclick="window._nextSlide()">التالي ▶</button>
      </div>
    </div>
  </div>

  <!-- ═══ Full Screen App Lock Gate (شاشة القفل العامة للتطبيق) ═══ -->
  <div id="app-lock-gate" class="app-lock-gate hidden" aria-live="polite">
    <div class="lock-gate-card">
      <div class="lock-gate-star">✦</div>
      <h2 class="lock-gate-title">X.v1</h2>
      <p class="lock-gate-sub">التطبيق محمي ومقفل بالكامل. يرجى إدخال كلمة السر للدخول.</p>

      <form id="lock-gate-form" class="lock-gate-form" onsubmit="event.preventDefault()">
        <div class="lock-input-group">
          <input
            type="password"
            id="gate-pin-input"
            class="lock-gate-input"
            placeholder="أدخل كلمة السر"
            maxlength="24"
            autocomplete="off"
          >
          <button type="submit" id="gate-unlock-btn" class="lock-gate-btn" aria-label="دخول">
            <span>دخول</span>
            <span>🔓</span>
          </button>
        </div>
      </form>

      <div class="lock-gate-footer">🔐 مشفر ومحمي بالكامل</div>
    </div>
  </div>

  <!-- Overlay -->
  <div id="overlay"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

</div>

<!-- Unified Application Script Bundle -->
<script src="./app.js?v=20260901"></script>
</body>
</html>
