<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#131315">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131315">
  <meta name="description" content="X.v1 — Advanced Intelligent Assistant">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="X.v1">

  <title>X.v1</title>
  <link rel="manifest" href="./manifest.json?v=242">
  <link rel="stylesheet" href="./style.css?v=242">
  <link rel="icon" type="image/png" href="./icons/icon-192.png?v=49">
  <link rel="apple-touch-icon" href="./icons/icon-192.png?v=49">
  <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png?v=49">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('xv1_theme') || 'obsidian';
        var f = localStorage.getItem('xv1_font_family') || 'inter';
        var s = localStorage.getItem('xv1_font_size') || 'md';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-font', f);
        document.documentElement.setAttribute('data-size', s);
      } catch(e) {}

      // Safe background cache cleanup without disruptive reload loops
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          // Service worker updated in background
        });
      }
      fetch('./version.json?t=' + Date.now()).then(function(r){ return r.json(); }).then(function(d){
        if (d && d.version) {
          var localVer = localStorage.getItem('XV1_APP_VERSION');
          if (localVer !== d.version) {
            localStorage.setItem('XV1_APP_VERSION', d.version);
            if (typeof caches !== 'undefined' && caches.keys) {
              caches.keys().then(function(keys){
                return Promise.all(keys.map(function(k){ return caches.delete(k); }));
              });
            }
          }
        }
      }).catch(function(){});
    })();
  </script>
  <script>
    (function () {
      var key = 'xv1_runtime_debug_log';
      function writeDebug(error, context) {
        var message = error && error.message ? error.message : String(error || 'Unknown error');
        var entry = {
          at: new Date().toISOString(),
          context: context || 'Runtime error',
          message: message,
          stack: error && error.stack ? error.stack : ''
        };
        try {
          var entries = JSON.parse(localStorage.getItem(key) || '[]');
          if (!Array.isArray(entries)) entries = [];
          entries.push(entry);
          localStorage.setItem(key, JSON.stringify(entries.slice(-30)));
        } catch (storageError) {
          console.error('[X.v1 debug log failed]', storageError);
        }
        console.error('[X.v1]', entry.context, entry.message, entry.stack);
        return entry;
      }
      window.printDebug = writeDebug;
      window.getDebugLog = function () {
        try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; }
      };
      window.addEventListener('error', function (event) {
        writeDebug(event.error || event.message, 'Early JavaScript error');
      });
      window.addEventListener('unhandledrejection', function (event) {
        writeDebug(event.reason, 'Early unhandled promise');
      });
    })();
  </script>
</head>
<body>
<div id="app">

  <!-- ═══ Drawer Sidebar (Left Side) ═══ -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="brand-logo">
        <span class="brand-star-icon">✦</span>
        <span>X.v1</span>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <button class="icon-btn" onclick="window._refreshApp()" title="تحديث ومزامنة التطبيق" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
        </button>
        <button class="icon-btn" id="close-sidebar-btn" aria-label="Close">✕</button>
      </div>
    </div>

    <!-- Main Navigation Actions -->
    <div class="sidebar-nav">
      <button class="nav-btn primary" id="btn-new-chat">
        <span>＋</span>
        <span>New Chat</span>
      </button>
    </div>

    <div class="sidebar-section-title">Recent Chats</div>
    <div id="conversations-list"></div>

    <div class="sidebar-footer">
      <button class="footer-btn" onclick="window._openSettingsModal()">
        <span>⚙️</span>
        <span>Settings</span>
      </button>
      <div id="app-version-badge" style="font-size:10.5px; color:var(--text-dim); font-family:var(--font-mono); text-align:center; padding:8px 0 2px; border-top:1px solid var(--border-subtle); margin-top:8px; letter-spacing:0.02em;">
        <span id="app-version-text">v242</span> • <span id="app-last-update">جاري...</span>
      </div>
    </div>
  </aside>

  <!-- ═══ Main View ═══ -->
  <main id="main">

    <!-- Top Header -->
    <header id="header" style="position:relative;">
      <button class="icon-btn" id="sidebar-toggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      </button>
      <div id="chat-top-badge" class="repo-status-badge" style="position:absolute; left:50%; transform:translateX(-50%);">
        <span class="status-dot"></span>
        <span class="repo-badge-text" id="chat-status-text" style="font-weight:700; letter-spacing:0.02em;">X (V242) —</span>
      </div>
      <script>
        (function() {
          var b = document.getElementById('chat-status-text');
          var saved = localStorage.getItem('CHAT_LAST_SYNC_BADGE');
          if (saved && b) b.textContent = saved;
          fetch('./version.json?t=' + Date.now()).then(function(r) { return r.json(); }).then(function(d) {
            if (d && d.version && d.updated_at && b) {
              var txt = 'X (V' + d.version + ') ' + d.updated_at;
              b.textContent = txt;
              localStorage.setItem('CHAT_LAST_SYNC_BADGE', txt);
            }
          }).catch(function(){});
        })();
      </script>
      <div class="header-right" style="display:flex; align-items:center; gap:6px;">
        <button class="icon-btn" onclick="window._refreshApp()" title="تحديث ومزامنة الصفحة" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
        </button>
      </div>
    </header>

    <!-- Modern Circular Pull to Refresh Indicator (سهم مدور مودرن بدون نصوص) -->
    <div id="pull-refresh-indicator" class="pull-refresh-indicator" aria-hidden="true">
      <svg class="pull-refresh-spinner" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
        <polyline points="21 3 21 9 15 9"></polyline>
      </svg>
    </div>

    <!-- Chat Messages Feed -->
    <div id="chat-area">
      <div class="chat-container" id="chat-container"></div>
    </div>

    <!-- Floating Input Bar -->
    <div id="input-section">

      <div class="input-container">

        <!-- Attachment Previews -->
        <div id="attachment-preview-container" class="attachment-previews hidden"></div>

        <!-- Textarea -->
        <textarea
          id="user-input"
          class="chat-textarea"
          placeholder="Reply to X.v1..."
          rows="1"
          autocomplete="off"
          autofocus
        ></textarea>

        <!-- Bottom Controls Row inside Container -->
        <div class="input-bottom-bar">
          
          <!-- Left Controls (Plus, Skills Button & Model Pill) -->
          <div class="input-bottom-left">
            <!-- Plus / Attach Button -->
            <button class="claude-plus-btn" id="attach-btn" title="Attach files or photos" aria-label="Attach">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>

            <!-- Vertical Skills Trigger & Menu (قائمة الميزات الرأسية) -->
            <div style="position: relative;">
              <button class="claude-skills-btn" id="skills-menu-trigger" title="AI Skills & Tools" aria-label="Skills">
                <span style="font-size: 14px;">✨</span>
              </button>

              <div class="skills-vertical-menu" id="skills-vertical-menu">
                <button class="skills-menu-opt" onclick="window._triggerSkill('roundtable')">
                  <span class="skill-opt-icon">👥</span>
                  <div class="skill-opt-text">
                    <div class="skill-opt-title">Roundtable</div>
                    <div class="skill-opt-desc">Multi-agent debate & review</div>
                  </div>
                </button>
                <button class="skills-menu-opt" onclick="window._triggerSkill('mindmap')">
                  <span class="skill-opt-icon">🗺️</span>
                  <div class="skill-opt-text">
                    <div class="skill-opt-title">Mind Map</div>
                    <div class="skill-opt-desc">Interactive visual tree outline</div>
                  </div>
                </button>
                <button class="skills-menu-opt" onclick="window._triggerSkill('slides')">
                  <span class="skill-opt-icon">📊</span>
                  <div class="skill-opt-text">
                    <div class="skill-opt-title">Slide Deck</div>
                    <div class="skill-opt-desc">1-click presentation slides</div>
                  </div>
                </button>
                <button class="skills-menu-opt" onclick="window._triggerSkill('sandbox')">
                  <span class="skill-opt-icon">🧪</span>
                  <div class="skill-opt-text">
                    <div class="skill-opt-title">Live Sandbox</div>
                    <div class="skill-opt-desc">Interactive app & code tester</div>
                  </div>
                </button>
              </div>
            </div>

            <!-- Multi-Agent Toggle — icon only -->
            <button class="claude-plus-btn multi-agent-toggle-pill" id="multi-agent-toggle-btn" onclick="window._toggleMultiAgentMode()" title="Multi-Agent Consensus" aria-label="Multi-Agent">
              <span style="font-size:14px;">👥</span>
            </button>

            <!-- Model Selector Pill -->
            <div style="position: relative;">
              <button class="claude-model-pill" id="model-pill-trigger">
                <span id="header-title-text">Balanced</span>
                <svg viewBox="0 0 12 12" width="10" height="10" fill="currentColor"><path d="M2 4l4 4 4-4z"/></svg>
              </button>

              <div class="model-dropdown" id="model-dropdown-menu">
                <button class="dropdown-opt" data-mode="BALANCE2">
                  <div class="opt-title">Balance 2</div>
                </button>
                <button class="dropdown-opt active" data-mode="MID">
                  <div class="opt-title">Balanced</div>
                </button>
                <button class="dropdown-opt" data-mode="FAST">
                  <div class="opt-title">FAST</div>
                </button>
              </div>
            </div>
          </div>

          <!-- Right Controls (Mic, Waveform & Send) -->
          <div class="input-bottom-right">
            <!-- Mic Button -->
            <button class="claude-voice-btn" id="mic-btn" title="Voice Input">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
              </svg>
            </button>

            <!-- Send Button -->
            <button id="send-btn" class="claude-send-btn" aria-label="Send" title="Send message" disabled>
              <svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>

        </div>

        <!-- Hidden Native File Input -->
        <input type="file" id="file-upload-input" multiple accept="image/*,text/*,.pdf,.txt,.js,.py,.html,.css,.json,.md,.csv" style="display: none;">
      </div>
    </div>

  </main>

  <!-- ═══ Interactive Live Sandbox Modal ═══ -->
  <div id="sandbox-modal" class="custom-modal hidden">
    <div class="custom-modal-card sandbox-card">
      <div class="custom-modal-header">
        <div class="modal-header-title">
          <span>🧪</span>
          <span>Live Interactive Sandbox</span>
        </div>
        <div class="modal-header-actions">
          <button class="icon-btn" onclick="window._reloadSandbox()" title="Restart">🔄</button>
          <button class="icon-btn" onclick="window._closeSandbox()" title="Close">✕</button>
        </div>
      </div>
      <div class="sandbox-iframe-wrap">
        <iframe id="sandbox-frame" sandbox="allow-scripts allow-modals allow-same-origin" title="Sandbox Output"></iframe>
      </div>
    </div>
  </div>

  <!-- ═══ Interactive Slide Deck Presentation Modal ═══ -->
  <div id="slides-modal" class="custom-modal hidden">
    <div class="custom-modal-card slides-card">
      <div class="custom-modal-header">
        <div class="modal-header-title">
          <span>📊</span>
          <span id="slides-deck-title">Interactive Slide Deck</span>
        </div>
        <div class="modal-header-actions">
          <button class="modal-action-btn" onclick="window._exportSlidesHTML()">📥 Download HTML</button>
          <button class="icon-btn" onclick="window._closeSlides()" title="Close">✕</button>
        </div>
      </div>
      <div class="slides-viewer-body">
        <div class="slide-content-area" id="slide-content-area"></div>
      </div>
      <div class="slides-footer-controls">
        <button class="slide-nav-btn" onclick="window._prevSlide()">◀ Previous</button>
        <span id="slide-indicator" class="slide-indicator">1 / 1</span>
        <button class="slide-nav-btn" onclick="window._nextSlide()">Next ▶</button>
      </div>
    </div>
  </div>

  <!-- ═══ Settings Modal ═══ -->
  <div id="settings-modal" class="custom-modal hidden" aria-hidden="true">
    <div class="custom-modal-card settings-card" style="max-width: 680px;">
      <div class="custom-modal-header">
        <div class="modal-header-title">
          <span>⚙️</span>
          <span>Settings</span>
        </div>
        <div class="modal-header-actions">
          <button class="icon-btn" onclick="window._closeSettingsModal()" title="Close">✕</button>
        </div>
      </div>

      <div class="settings-modal-body">
        
        <!-- ═══ Settings Navigation Tabs (vertical) ═══ -->
        <div class="settings-modal-tabs-bar">
          <button type="button" class="settings-tab-btn active" data-tab="usage" onclick="window._switchSettingsTab('usage')">
            <span>📊</span>
            <span>Usage</span>
          </button>
          <button type="button" class="settings-tab-btn" data-tab="themes" onclick="window._switchSettingsTab('themes')">
            <span>🎨</span>
            <span>Theme</span>
          </button>
          <button type="button" class="settings-tab-btn" data-tab="instructions" onclick="window._switchSettingsTab('instructions')">
            <span>📁</span>
            <span>Instructions</span>
          </button>
          <button type="button" class="settings-tab-btn" data-tab="system" onclick="window._switchSettingsTab('system')">
            <span>⚙️</span>
            <span>System</span>
          </button>
          <button type="button" class="settings-tab-btn settings-tab-clear-btn" onclick="window._clearAppCache()" title="Clear Cache & Reload">
            <span>🧹</span>
            <span>Clear Cache</span>
          </button>
        </div>

        <!-- ═══ Tab 0: Usage & Metrics (First tab!) ═══ -->
        <div id="settings-tab-usage" class="settings-tab-pane active">
          <div class="settings-section usage-section" id="usage-section" style="margin-top:0;">
            <div class="settings-section-title">
              <span>📊</span>
              <span>API Usage & Live Metrics</span>
              <span id="usage-live-dot" class="usage-live-dot" title="Auto-synced"></span>
            </div>
            <div class="usage-grid">
              <div class="usage-card openrouter">
                <div class="usage-card-head"><span>OpenRouter</span><span class="usage-badge real">Real</span></div>
                <div class="usage-stats">
                  <div class="usage-stat"><span class="usage-num" id="or-tokens">—</span><span class="usage-label">Tokens</span></div>
                  <div class="usage-stat"><span class="usage-num" id="or-reqs">—</span><span class="usage-label">Reqs</span></div>
                </div>
                <div class="usage-sub" id="or-sub">Fetching...</div>
              </div>
              <div class="usage-card groq">
                <div class="usage-card-head"><span>Groq</span><span class="usage-badge local">Tracked</span></div>
                <div class="usage-stats">
                  <div class="usage-stat"><span class="usage-num" id="groq-tokens">—</span><span class="usage-label">Tokens</span></div>
                  <div class="usage-stat"><span class="usage-num" id="groq-reqs">—</span><span class="usage-label">Reqs</span></div>
                </div>
                <div class="usage-sub" id="groq-sub">Last Model: —</div>
              </div>
            </div>
          </div>
        </div>

        <!-- ═══ Tab 1: Themes & Fonts ═══ -->
        <div id="settings-tab-themes" class="settings-tab-pane hidden">
          <div style="display:flex; flex-direction:column; gap:14px;">
            <!-- Theme Selection -->
            <div>
              <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px;">Theme</label>
              <div class="theme-selector-grid">
                <button type="button" class="theme-card-btn active" data-theme="obsidian" onclick="window._setAppTheme('obsidian')">
                  <div class="theme-preview-dot obsidian"></div>
                  <div class="theme-card-info">
                    <span class="theme-title">Midnight Obsidian</span>
                    <span class="theme-sub">الداكن الكلاسيكي (الحالي)</span>
                  </div>
                </button>
                <button type="button" class="theme-card-btn" data-theme="emerald" onclick="window._setAppTheme('emerald')">
                  <div class="theme-preview-dot emerald"></div>
                  <div class="theme-card-info">
                    <span class="theme-title">Emerald Matrix</span>
                    <span class="theme-sub">الزمردي النيون (Cyber)</span>
                  </div>
                </button>
                <button type="button" class="theme-card-btn" data-theme="amethyst" onclick="window._setAppTheme('amethyst')">
                  <div class="theme-preview-dot amethyst"></div>
                  <div class="theme-card-info">
                    <span class="theme-title">Velvet Amethyst</span>
                    <span class="theme-sub">الأرجواني الملكي (Royal)</span>
                  </div>
                </button>
                <button type="button" class="theme-card-btn" data-theme="sapphire" onclick="window._setAppTheme('sapphire')">
                  <div class="theme-preview-dot sapphire"></div>
                  <div class="theme-card-info">
                    <span class="theme-title">Oceanic Sapphire</span>
                    <span class="theme-sub">الأزرق الكوني (Ocean)</span>
                  </div>
                </button>
              </div>
            </div>

            <!-- Font Family -->
            <div style="padding-top:10px; border-top:1px solid var(--border-subtle);">
              <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px;">Font Family</label>
              <div class="custom-pill-selector-row">
                <button type="button" class="custom-pill-btn active" data-font="inter" onclick="window._setAppFontFamily('inter')">Inter</button>
                <button type="button" class="custom-pill-btn" data-font="cairo" onclick="window._setAppFontFamily('cairo')">Cairo</button>
                <button type="button" class="custom-pill-btn" data-font="tajawal" onclick="window._setAppFontFamily('tajawal')">Tajawal</button>
                <button type="button" class="custom-pill-btn" data-font="mono" onclick="window._setAppFontFamily('mono')">Mono</button>
              </div>
            </div>

            <!-- Font Size -->
            <div>
              <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px;">Font Size</label>
              <div class="custom-pill-selector-row">
                <button type="button" class="custom-pill-btn" data-size="sm" onclick="window._setAppFontSize('sm')">Small</button>
                <button type="button" class="custom-pill-btn active" data-size="md" onclick="window._setAppFontSize('md')">Medium</button>
                <button type="button" class="custom-pill-btn" data-size="lg" onclick="window._setAppFontSize('lg')">Large</button>
                <button type="button" class="custom-pill-btn" data-size="xl" onclick="window._setAppFontSize('xl')">XL</button>
              </div>
            </div>
          </div>
        </div>

        <!-- ═══ Tab 3: Instruction Files Manager ═══ -->
        <div id="settings-tab-instructions" class="settings-tab-pane hidden">
          <div class="inst-manager-topbar">
            <div class="inst-topbar-actions" style="margin-bottom: 8px;">
              <button class="settings-action-btn" onclick="window._addNewInstructionFile()"><span>+</span> Add New File</button>
              <button class="settings-action-btn" onclick="window._resetDefaultInstructionFiles()">Reset Default</button>
            </div>
          </div>

          <!-- Instruction Files Grid / List -->
          <div id="instruction-files-list" class="instruction-files-list"></div>

          <!-- Active Instruction Editor Sub-panel (When a file is selected) -->
          <div id="instruction-editor-panel" class="instruction-editor-panel hidden">
            <div class="inst-editor-header">
              <div class="inst-editor-title-wrap">
                <span id="inst-editor-icon" class="inst-editor-icon">📄</span>
                <input type="text" id="inst-editor-name" class="inst-editor-name-input" placeholder="Instruction file name...">
              </div>
              <div class="inst-editor-tools">
                <label class="inst-toggle-label">
                  <input type="checkbox" id="inst-editor-enabled" class="inst-checkbox">
                  <span>Enabled</span>
                </label>
              </div>
            </div>

            <div class="inst-editor-meta" style="margin-bottom:6px;">
              <input type="text" id="inst-editor-keywords" class="inst-editor-meta-input" placeholder="Trigger keywords (comma separated)...">
            </div>

            <textarea
              id="inst-editor-content"
              class="settings-textarea inst-content-textarea"
              style="font-family: var(--font-mono); font-size: 12px; line-height: 1.45;"
              rows="8"
              placeholder='{ "key": "value" }'
            ></textarea>

            <div class="inst-editor-footer">
              <div class="inst-footer-left">
                <button id="inst-delete-btn" class="inst-delete-btn hidden" onclick="window._deleteActiveInstructionFile()">
                  <span>🗑️</span>
                  <span>Delete File</span>
                </button>
              </div>
              <div class="inst-footer-right">
                <button class="btn-refresh-cancel" onclick="window._closeInstructionEditor()">Close Editor</button>
                <button class="settings-save-btn" onclick="window._saveActiveInstructionFile()">
                  <span>💾</span>
                  <span>Save Changes</span>
                </button>
              </div>
            </div>
          </div>
