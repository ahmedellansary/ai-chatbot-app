<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ChatBot PWA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- نافذة الدردشة -->
    <div id="chat-window"></div>

    <!-- شريط الإدخال (يظهر في وضع الشات أو وضع المطور) -->
    <div id="input-bar">
      <!-- زر رفع ملفات -->
      <input type="file" id="file-input" multiple accept="image/*,video/*,audio/*">
      <label for="file-input" id="file-input-label" title="رفع ملفات">
        📎
      </label>

      <!-- حقل النص -->
      <input type="text" id="message-input" placeholder="اكتب رسالتك...">

      <!-- زر الإرسال -->
      <button id="send-button">إرسال</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
